gui:
  theme:
    lightTheme: false
    activeBorderColor:
      - "#cccccc"
      - bold
    inactiveBorderColor:
      - "#555555"
    optionsTextColor:
      - "#888888"
    selectedLineBgColor:
      - "#3a3a3a"
    selectedRangeBgColor:
      - "#4d4d4d"
    cherryPickedCommitBgColor:
      - "#444444"
    cherryPickedCommitFgColor:
      - "#eeeeee"
    unstagedChangesColor:
      - "#ff6666"
customCommands:
  - key: "C"
    context: "files"
    description: "Commit with Commitizen"
    command: "bash -c git cz"
    loadingText: "Launching Commitizen..."
    output: log
  - key: "s"
    context: "localBranches"
    prompts:
      - type: "menu"
        title: "What kind of branch is it?"
        key: "BranchType"
        options:
          - name: "feature"
            description: "a feature branch"
            value: "feature"
          - name: "bugfix"
            description: "a bugfix branch"
            value: "bugfix"
          - name: "hotfix"
            description: "a hotfix branch"
            value: "hotfix"
          - name: "release"
            description: "a release branch"
            value: "release"
      - type: "input"
        title: "What is the new branch name?"
        key: "BranchName"
        initialValue: ""
    command: "git flow {{.Form.BranchType}} start {{.Form.BranchName}}"
    loadingText: "Creating branch"
  - key: "f"
    context: "localBranches"
    prompts:
      - type: "menu"
        title: "What kind of branch is it?"
        key: "BranchType"
        options:
          - name: "feature"
            description: "a feature branch"
            value: "feature"
          - name: "bugfix"
            description: "a bugfix branch"
            value: "bugfix"
          - name: "hotfix"
            description: "a hotfix branch"
            value: "hotfix"
          - name: "release"
            description: "a release branch"
            value: "release"
      - type: "input"
        title: "What is the new branch name?"
        key: "BranchName"
        initialValue: ""
    command: "git flow {{.Form.BranchType}} finish {{.Form.BranchName}}"
    loadingText: "finishing branch"
